[package]
name = "lightning-router-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
lightning-router-frame = { path = "../frame" }
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
idevice = { version = "0.1.63", features = ["usbmuxd"] }
env_logger = { version = "0.11" }
ipstack = "1.0.1"

[dev-dependencies]
etherparse = "0.20"
lightning-router = { path = ".." }
