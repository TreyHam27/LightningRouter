[package]
name = "lightning-router-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
lightning-router-frame = { path = "../frame" }
tokio = { version = "1.47", features = ["rt", "net", "io-util", "macros", "time"] }
idevice = { version = "0.1.63", features = ["usbmuxd"] }
env_logger = { version = "0.11" }
